# This is a basic workflow to help you get started with Actions

name: CI
on:
  push:
    branches:
      - main
  schedule:
    - cron: '47 * * * *'  # “At minute 47.”
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.160.0'
          extended: false
      - name: Build Website
        run: ls -l
